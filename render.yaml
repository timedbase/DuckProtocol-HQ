services:
  # DuckProtocol's backend API -- Robinhood Chain (4663) and Ink (57073).
  # Both subgraphs are hosted on Goldsky, so no self-hosted indexing here.
  - type: web
    name: duckprotocol-hq-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run api
    envVars:
      # Dedicated RPCs -- each chain falls back to its public RPC if unset.
      - key: ROBINHOOD_RPC_URL
        sync: false
      - key: INK_RPC_URL
        sync: false
      # Optional -- both default to the "current" Goldsky tag of their
      # subgraph (duck-subgraph-rh / duck-subgraph-ink).
      # - key: ROBINHOOD_SUBGRAPH_URL
      #   value: https://api.goldsky.com/api/public/project_cmhtxnzpqm81001w94ksmgira/subgraphs/duck-subgraph-rh/current/gn
      # - key: INK_SUBGRAPH_URL
      #   value: https://api.goldsky.com/api/public/project_cmhtxnzpqm81001w94ksmgira/subgraphs/duck-subgraph-ink/current/gn
      - key: PORT
        value: "3000"
      - key: PINATA_JWT
        sync: false
      # Backs persisted token comments/chat -- optional.
      - key: DATABASE_URL
        sync: false
      # The platform's own $DUCK token per chain -- the only token marked
      # `verified: true`. Leave unset until it launches on that chain.
      - key: ROBINHOOD_DUCK_TOKEN_ADDRESS
        sync: false
      - key: INK_DUCK_TOKEN_ADDRESS
        sync: false

  # DuckKeeper -- calls claimFees/triggerBuyback/processBatch on both chains
  # on a schedule (see DuckKeeper/README.md). Holds no special role in any
  # contract. One pass per invocation, then exits.
  - type: cron
    name: duckprotocol-hq-keeper
    runtime: node
    plan: starter
    region: oregon
    rootDir: DuckKeeper
    schedule: "0 */3 * * *"
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run keeper
    envVars:
      - key: ROBINHOOD_RPC_URL
        sync: false
      - key: INK_RPC_URL
        sync: false
      # A plain EOA key funded with gas on both chains -- never the
      # protocol owner/deployer key. See DuckKeeper/.env.example.
      - key: KEEPER_PRIVATE_KEY
        sync: false
