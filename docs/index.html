<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>duckpad docs</title>
<meta name="description" content="DuckProtocol documentation: launch families, fees, lending, governance, and an integration guide for Robinhood Chain and Ink." />
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #131313; --card: #1b1b1b; --raised: #222; --ink: #fafafa; --line: #2a2a2a; --soft: #232323;
    --mute: #9a9a9a; --body: #d4d4d4; --lime: #a3e635; --lime-dim: rgba(163,230,53,.12); --orange: #f5a623;
    --orange-dim: rgba(245,166,35,.1); --on: #141c06; --neg: #f0654a;
    --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'Outfit', -apple-system, system-ui, sans-serif;
    --top: 54px; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--top) + 20px); }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  code, .mono { font-family: var(--mono); }
  ::selection { background: rgba(163,230,53,.28); }

  /* ------------------------------------------------------------------ topbar */
  .topbar {
    position: sticky; top: 0; z-index: 40; height: var(--top);
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: rgba(19,19,19,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 24px; height: 24px; object-fit: contain; }
  .brand .word { font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
  .brand .tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--on); background: var(--lime); border-radius: 5px; padding: 1px 6px; font-weight: 700;
  }
  .search-wrap { position: relative; flex: 1; max-width: 460px; margin-left: 12px; }
  .search-wrap input {
    width: 100%; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); padding: 0 40px 0 34px; font: 13px var(--sans); outline: 0; transition: border-color .15s;
  }
  .search-wrap input::placeholder { color: var(--mute); }
  .search-wrap input:focus { border-color: var(--lime); }
  .search-wrap .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mute); display: flex; }
  .search-wrap .kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 10.5px var(--mono);
    color: var(--mute); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--paper);
  }
  .top-links { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    transition: border-color .15s, background .15s; white-space: nowrap;
  }
  .btn:hover { border-color: #3a3a3a; background: var(--raised); }
  .btn.primary { background: var(--lime); color: var(--on); border-color: var(--lime); }
  .btn.primary:hover { background: #b4f04a; }
  .btn .mono { font-size: 11.5px; }
  .menu-btn { display: none; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; flex: none; align-items: center; justify-content: center; }

  /* ------------------------------------------------------------------ shell */
  .shell { display: grid; grid-template-columns: 244px minmax(0, 1fr) 212px; max-width: 1440px; margin: 0 auto; }

  .sidebar {
    position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto;
    padding: 14px 10px 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .nav-group + .nav-group { margin-top: 2px; }
  .nav-group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 0; border-radius: 7px;
    background: transparent; color: var(--mute); cursor: pointer; text-align: left;
  }
  .nav-group-head:hover { color: var(--ink); }
  .nav-group-head .num { font: 600 9.5px var(--mono); color: #666; letter-spacing: .04em; }
  .nav-group-head .ttl { flex: 1; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .nav-group-head .chev { transition: transform .15s; display: flex; }
  .nav-group.collapsed .chev { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-pages { display: none; }
  .nav-pages { display: flex; flex-direction: column; gap: 1px; padding: 0 0 4px; }
  .page-link {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 5px 10px; border-radius: 7px; font-size: 13px; color: var(--body); transition: background .12s, color .12s;
  }
  .page-link:hover { background: var(--soft); color: var(--ink); }
  .page-link.active { background: var(--ink); color: var(--paper); font-weight: 600; }
  .page-link .arrow { opacity: 0; transition: opacity .12s; font-size: 11px; }
  .page-link.active .arrow { opacity: 1; }

  .sidebar-foot { margin-top: auto; padding: 18px 6px 0; }
  .chain-card { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px; }
  .chain-card .label { font: 600 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
  .chain-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; font-size: 12px; }
  .chain-row + .chain-row { border-top: 1px solid var(--soft); }
  .chain-row .id { font: 11px var(--mono); color: var(--mute); }
  .chain-row a:hover { color: var(--lime); }

  /* ------------------------------------------------------------------ content */
  .content { min-width: 0; padding: 36px 48px 80px; }
  .article { max-width: 740px; margin: 0 auto; }
  .page-head { margin-bottom: 28px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--lime); background: var(--lime-dim); border-radius: 999px; padding: 3px 9px; margin-bottom: 12px;
  }
  .article h1 { font-size: 30px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; margin: 0 0 10px; }
  .lede { font-size: 15px; color: var(--mute); line-height: 1.6; margin: 0; }

  .article h2 { position: relative; font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin: 38px 0 12px; line-height: 1.3; }
  .article h3 { position: relative; font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin: 24px 0 8px; }
  .article h2:first-child { margin-top: 0; }
  .anchor { position: absolute; left: -24px; top: 0; color: #555; opacity: 0; font-weight: 500; padding-right: 8px; }
  .article h2:hover .anchor, .article h3:hover .anchor { opacity: 1; }
  .anchor:hover { color: var(--lime); }
  .article p { color: var(--body); margin: 0 0 14px; }
  .article ul, .article ol { color: var(--body); padding-left: 20px; margin: 0 0 18px; }
  .article li { margin-bottom: 5px; padding-left: 4px; }
  .article li::marker { color: #5c5c5c; }
  .article strong { color: var(--ink); font-weight: 600; }
  .article a:not(.btn):not(.card):not(.anchor) { color: var(--lime); text-decoration: underline; text-decoration-color: rgba(163,230,53,.35); text-underline-offset: 3px; }
  .article a:not(.btn):not(.card):not(.anchor):hover { text-decoration-color: var(--lime); }
  .article code:not(pre code) {
    font-size: .86em; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: #e8f5d0;
  }

  /* code blocks (app.js wraps every <pre> in .codeblock) */
  .codeblock { border: 1px solid var(--line); border-radius: var(--radius); background: #0f0f0f; margin: 0 0 22px; overflow: hidden; }
  .code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); background: #161616; }
  .code-head .lang { font: 600 10px var(--mono); color: var(--mute); letter-spacing: .06em; }
  .codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 12px/1.6 var(--mono); }
  .codeblock pre code { color: #e4e4e4; }
  .codeblock .m { color: #6f6f6f; }
  .codeblock .k { color: var(--lime); }
  .codeblock .s { color: #f0c674; }

  .copy {
    display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper); color: var(--mute); font: 600 10px var(--mono); cursor: pointer;
  }
  .copy:hover { color: var(--ink); border-color: #3a3a3a; }
  .copy.done { color: var(--lime); border-color: rgba(163,230,53,.45); }

  /* callouts */
  .callout { display: grid; grid-template-columns: 26px 1fr; gap: 10px; border-radius: var(--radius); padding: 13px 14px; margin: 0 0 22px; border: 1px solid var(--line); background: var(--card); }
  .callout::before {
    content: "i"; width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font: 700 12px var(--mono); background: var(--lime-dim); color: var(--lime);
  }
  .callout.warn::before { content: "!"; background: var(--orange-dim); color: var(--orange); }
  .callout.tip::before { content: "→"; }
  .callout .callout-title { font-weight: 700; font-size: 13.5px; margin: 3px 0 3px; }
  .callout p { margin: 0; font-size: 13px; }
  .callout > div, .callout > p { grid-column: 2; }

  /* tables (app.js wraps every table in .table-wrap) */
  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; margin: 0 0 24px; background: var(--card); }
  table.data { width: 100%; border-collapse: collapse; }
  table.data th { text-align: left; font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding: 9px 14px; border-bottom: 1px solid var(--line); background: #181818; white-space: nowrap; }
  table.data td { padding: 9px 14px; border-bottom: 1px solid var(--soft); font-size: 13px; color: var(--body); vertical-align: top; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td.mono { font-family: var(--mono); font-size: 12px; }
  table.data td.addr { font: 11.5px var(--mono); color: var(--mute); white-space: nowrap; }
  table.data td.addr .copy { margin-left: 8px; vertical-align: middle; }

  .method { font: 700 9.5px var(--mono); padding: 3px 8px; border-radius: 6px; letter-spacing: .04em; }
  .method.get { background: var(--lime-dim); color: var(--lime); }
  .method.post { background: var(--orange-dim); color: var(--orange); }

  /* hero */
  .hero { position: relative; border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin: 0 0 34px; overflow: hidden;
    background: radial-gradient(120% 140% at 100% 0%, rgba(163,230,53,.14), transparent 55%), var(--card); }
  .hero h2 { margin: 6px 0 6px !important; font-size: 21px; }
  .hero p { max-width: 58ch; }
  .hero .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--body); }
  .chip b { color: var(--lime); font-weight: 600; }

  /* cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 0 0 26px; }
  .card { display: flex; flex-direction: column; gap: 5px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 14px; transition: border-color .15s, transform .15s, background .15s; }
  .card:hover { border-color: rgba(163,230,53,.5); background: var(--raised); transform: translateY(-2px); }
  .card .card-tag { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .card .card-title { font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
  .card .card-title span { color: var(--lime); transition: transform .15s; }
  .card:hover .card-title span { transform: translateX(3px); }
  .card .card-desc { font-size: 12.5px; color: var(--mute); line-height: 1.5; }

  /* steps */
  .steps { counter-reset: step; margin: 0 0 26px; }
  .step { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding-bottom: 18px; }
  .step::before {
    counter-increment: step; content: counter(step); width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font: 700 12px var(--mono); background: var(--lime); color: var(--on);
  }
  .step::after { content: ""; position: absolute; left: 13.5px; top: 34px; bottom: 6px; width: 1px; background: var(--line); }
  .step:last-child::after { display: none; }
  .step > .step-body { min-width: 0; padding-top: 4px; }
  .step .step-title { font-size: 14.5px; font-weight: 700; letter-spacing: -.015em; margin-bottom: 6px; }
  .step .step-body p:last-child { margin-bottom: 0; }

  /* tabs */
  .tabs { margin: 0 0 24px; }
  .tab-list { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); margin-bottom: 12px; max-width: 100%; overflow-x: auto; }
  .tab-btn { border: 0; background: transparent; color: var(--mute); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { background: var(--ink); color: var(--paper); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* key/value grid */
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 0 0 24px; }
  .kv > div { background: var(--card); padding: 12px 14px; }
  .kv .k { font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .kv .v { font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
  .kv .v small { font-size: 11.5px; color: var(--mute); font-weight: 500; letter-spacing: 0; }

  /* prev / next */
  .page-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
  .page-nav a { border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; background: var(--card); transition: border-color .15s; }
  .page-nav a:hover { border-color: rgba(163,230,53,.5); }
  .page-nav .dir { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .page-nav .ttl { font-size: 14px; font-weight: 700; margin-top: 4px; letter-spacing: -.015em; }
  .page-nav .next { text-align: right; grid-column: 2; }

  /* ------------------------------------------------------------------ toc */
  .toc { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; padding: 36px 16px 32px 6px; }
  .toc-title { font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 12px; }
  .toc a { display: block; font-size: 12px; color: var(--mute); padding: 4px 0; line-height: 1.4; transition: color .12s; }
  .toc a.sub { padding-left: 12px; font-size: 11.5px; }
  .toc a:hover { color: var(--ink); }
  .toc a.active { color: var(--lime); font-weight: 600; }
  .toc-actions { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .toc-actions a { font-size: 11.5px; color: var(--mute); }
  .toc-actions a:hover { color: var(--ink); }

  /* ------------------------------------------------------------------ search */
  .search-results { position: absolute; top: 46px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 16px 40px rgba(0,0,0,.45); max-height: 400px; overflow-y: auto; z-index: 50; display: none; padding: 6px; }
  .search-results.show { display: block; }
  .res { padding: 10px 12px; border-radius: 9px; cursor: pointer; }
  .res:hover, .res.sel { background: var(--soft); }
  .res .g { font: 600 10px var(--mono); color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
  .res .t { font-size: 13px; font-weight: 600; margin-top: 1px; }
  .res .x { font-size: 11.5px; color: var(--mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .x mark { background: none; color: var(--lime); }
  .search-results .empty { padding: 16px 12px; font-size: 13px; color: var(--mute); }

  .scrim { display: none; }

  @media (max-width: 1240px) {
    .shell { grid-template-columns: 244px minmax(0, 1fr); }
    .toc { display: none; }
  }
  @media (max-width: 900px) {
    .menu-btn { display: flex; }
    .top-links .btn:not(.primary) { display: none; }
    .search-wrap { margin-left: 0; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: fixed; top: var(--top); left: 0; bottom: 0; width: 290px; height: auto; background: var(--paper); z-index: 46; transform: translateX(-100%); transition: transform .2s ease; }
    .sidebar.open { transform: translateX(0); }
    .scrim.show { display: block; position: fixed; inset: var(--top) 0 0 0; background: rgba(0,0,0,.55); z-index: 45; }
    .content { padding: 30px 20px 72px; }
    .article h1 { font-size: 25px; }
    .anchor { display: none; }
    .hero { padding: 22px; }
  }
  @media (max-width: 560px) {
    .topbar { gap: 10px; padding: 0 12px; }
    .brand { gap: 7px; }
    .brand img { width: 24px; height: 24px; }
    .brand .word { font-size: 15px; }
    .brand .tag { display: none; }
    .search-wrap .kbd { display: none; }
    .search-wrap input { padding-right: 12px; }
    .top-links .btn.primary .label { display: none; }
    .page-nav { grid-template-columns: 1fr; }
    .page-nav .next { grid-column: 1; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/overview"><img src="logo.png" alt="" /><span class="word">duckpad</span><span class="tag">docs</span></a>
  <div class="search-wrap">
    <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
    <input type="search" id="searchInput" placeholder="Search the docs" autocomplete="off" />
    <span class="kbd">/</span>
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="top-links">
    <a class="btn" href="llms.txt" target="_blank" rel="noreferrer"><span class="mono">llms.txt</span></a>
    <a class="btn" href="#/integrate">Integrate</a>
    <a class="btn primary" href="https://duckpad.fun" target="_blank" rel="noreferrer"><span class="label">Open app</span> ↗</a>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div id="sidebarNav"></div>
    <div class="sidebar-foot">
      <div class="chain-card">
        <div class="label">Live on</div>
        <div class="chain-row"><a href="https://robinhoodchain.blockscout.com" target="_blank" rel="noreferrer">Robinhood Chain ↗</a><span class="id">4663</span></div>
        <div class="chain-row"><a href="https://explorer.inkonchain.com" target="_blank" rel="noreferrer">Ink ↗</a><span class="id">57073</span></div>
      </div>
    </div>
  </nav>
  <main class="content"><article class="article" id="content"></article></main>
  <aside class="toc" id="toc"></aside>
</div>
<div class="scrim" id="scrim"></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
